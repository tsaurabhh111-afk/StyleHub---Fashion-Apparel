<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | StyleHub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="css/style.css"></head>
<body><header class="header"><a class="logo" href="index.html"><span>✦</span> StyleHub</a><div class="secure">🔒 Secure checkout</div></header><main class="page"><div class="page-title"><p class="eyebrow">ALMOST THERE</p><h1>Checkout</h1></div><div class="checkout-layout"><form class="checkout-form" onsubmit="placeOrder(event)"><h3>Shipping address</h3><div class="form-grid"><label>First name<input required placeholder="Saurabh"></label><label>Last name<input required placeholder="Tiwari"></label><label class="full">Address<input required placeholder="House / Street / Area"></label><label>City<input required placeholder="City"></label><label>PIN code<input required pattern="[0-9]{6}" placeholder="226001"></label><label class="full">Phone<input required pattern="[0-9]{10}" placeholder="10-digit mobile number"></label></div><h3>Payment method</h3><label class="payment"><input type="radio" name="pay" checked> 💳 Card / UPI / Net Banking</label><label class="payment"><input type="radio" name="pay"> 💵 Cash on Delivery</label><button class="btn btn-dark full-btn" type="submit">Place Order</button></form><div id="checkoutSummary" class="summary"></div></div></main><script src="js/app.js"></script></body></html>
